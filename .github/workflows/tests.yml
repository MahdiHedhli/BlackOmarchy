name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gnupg libarchive-tools
      - name: Run unit and bootstrap regression tests
        run: bash tests/unit/run.sh
      - name: Check whitespace
        run: git show --format= --check HEAD
